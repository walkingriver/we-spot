<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/setup"></ion-back-button>
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Solitaire</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/home" routerDirection="back">
        <ion-icon slot="icon-only" color="dark" name="home"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="texture">
  <div class="card-grid">
    <div id="previous-card" class="card">
      <div class="spinner-prev">
        @if (previousCard(); as p) {
          <app-dobble-card
            (symbolClick)="onSymbolClick($event)"
            [card]="p.symbols"
          ></app-dobble-card>
        }
      </div>
    </div>
    <div id="current-card" class="card">
      <div class="spinner-next">
        @if (currentCard(); as c) {
          <app-dobble-card
            (symbolClick)="onSymbolClick($event)"
            [card]="c.symbols"
          ></app-dobble-card>
        }
      </div>
    </div>
  </div>

  <ion-modal
    [isOpen]="gameOver() && showGameOver()"
    (didDismiss)="onModalDismissed()"
    [keyboardClose]="true"
    [breakpoints]="[0, 0.5, 0.75, 1]"
    [initialBreakpoint]="0.75"
    [canDismiss]="true"
  >
    <app-game-over
      style="height: 100%"
      (closed)="onGameOverClosed()"
      [score]="score()"
      [game]="deckInfo()?.slug ?? ''"
      [symbols]="deckInfo()?.symbolsPerCard ?? 0"
      [deckSize]="deckSize()"
      [card]="previousCard()?.symbols ?? []"
    ></app-game-over>
  </ion-modal>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-title>
      @if (score()) {
        <ion-label>Score: {{ score() }}</ion-label>
      }
    </ion-title>
    <ion-buttons slot="end">
      @if (gameOver()) {
        <ion-button (click)="openShareModal()">
          <ion-icon slot="icon-only" name="share"></ion-icon>
        </ion-button>
      }
    </ion-buttons>
  </ion-toolbar>
</ion-footer>

@if (currentCard() && index()) {
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary">
      {{ index() }}
    </ion-fab-button>
  </ion-fab>
}
